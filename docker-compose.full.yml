services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: eigent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eigent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eigent']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eigent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - eigent_redis_data:/data
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    image: ghcr.io/${IMAGE_REGISTRY}/eigent/eigent-server:${IMAGE_TAG:-latest}
    container_name: eigent_api
    restart: unless-stopped
    ports:
      - '3001:5678'
    env_file:
      - server/.env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5678/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery_worker:
    image: ghcr.io/${IMAGE_REGISTRY}/eigent/eigent-server:${IMAGE_TAG:-latest}
    container_name: eigent_celery_worker
    restart: unless-stopped
    command: /app/celery/worker/start
    env_file:
      - server/.env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A app.core.celery inspect ping -d celery@$$HOSTNAME',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat Scheduler
  celery_beat:
    image: ghcr.io/${IMAGE_REGISTRY}/eigent/eigent-server:${IMAGE_TAG:-latest}
    container_name: eigent_celery_beat
    restart: unless-stopped
    command: /app/celery/beat/start
    env_file:
      - server/.env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network

  # Web Frontend
  web:
    image: ghcr.io/${IMAGE_REGISTRY}/eigent/eigent-web:${IMAGE_TAG:-latest}
    container_name: eigent_web
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      - VITE_API_URL=http://api:5678
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  eigent_redis_data:

networks:
  eigent_network:
    driver: bridge
